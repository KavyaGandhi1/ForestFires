
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest Fire FWI Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;

            background:
                linear-gradient(rgba(8, 20, 15, 0.65),
                                rgba(8, 20, 15, 0.75)),
                url("https://images.unsplash.com/photo-1448375240586-882707db888b")
                center/cover fixed;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);

            color: white;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 8px;
            color: #f3f4f6;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9px;

            background: rgba(255, 255, 255, 0.13);
            color: white;

            outline: none;
            font-size: 14px;
        }

        input::placeholder {
            color: #d1d5db;
        }

        input:focus, select:focus {
            border-color: #86efac;
            box-shadow: 0 0 8px rgba(134, 239, 172, 0.3);
        }

        select option {
            color: #111827;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #22c55e;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;

            background: rgba(34, 197, 94, 0.18);
            border: 1px solid rgba(134, 239, 172, 0.4);
            border-radius: 12px;
        }

        .result h2 {
            color: #86efac;
            margin-bottom: 8px;
        }

        .result p {
            font-size: 28px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            text-align: center;
            color: #fecaca;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 25px 18px;
            }
        }

        @media (max-width: 420px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>🌲 Forest Fire Prediction</h1>

        <p class="subtitle">
            Enter weather conditions to calculate the Fire Weather Index
        </p>

        <form action="{{url_for('predict')}}" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Temperature (°C)</label>
                    <input type="number" step="any"
                           name="Temperature" placeholder="e.g. 29"
                           required>
                </div>

                <div class="form-group">
                    <label>Relative Humidity (RH)</label>
                    <input type="number" step="any"
                           name="RH" placeholder="e.g. 57"
                           required>
                </div>

                <div class="form-group">
                    <label>Wind Speed (Ws)</label>
                    <input type="number" step="any"
                           name="Ws" placeholder="e.g. 18"
                           required>
                </div>

                <div class="form-group">
                    <label>Rain (mm)</label>
                    <input type="number" step="any"
                           name="Rain" placeholder="e.g. 0"
                           required>
                </div>

                <div class="form-group">
                    <label>FFMC</label>
                    <input type="number" step="any"
                           name="FFMC" placeholder="e.g. 65"
                           required>
                </div>

                <div class="form-group">
                    <label>DMC</label>
                    <input type="number" step="any"
                           name="DMC" placeholder="e.g. 20"
                           required>
                </div>

                

                <div class="form-group">
                    <label>ISI</label>
                    <input type="number" step="any"
                           name="ISI" placeholder="e.g. 5"
                           required>
                </div>

                

                <div class="form-group">
                    <label>Classes</label>
                    <select name="Classes" required>
                        <option value="" disabled selected>
                            Select Class
                        </option>
                        <option value="0">Not Fire</option>
                        <option value="1">Fire</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Region</label>
                    <select name="Region" required>
                        <option value="" disabled selected>
                            Select Region
                        </option>
                        <option value="0">Bejaia</option>
                        <option value="1">Sidi-Bel Abbes</option>
                    </select>
                </div>

            </div>

            <button type="submit">Predict FWI →</button>

        </form>

        {% if prediction is not none %}
            <div class="result">
                <h2>Predicted Fire Weather Index</h2>
                <p>{{ prediction }}</p>
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

    </div>

</body>
</html>
